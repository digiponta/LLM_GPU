<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#fff}
    .sub{font:22px Arial,sans-serif;fill:#e9f3ff}
    .h{font:700 28px Arial,sans-serif;fill:#0b2d6b}
    .t{font:20px Arial,sans-serif;fill:#10233d}
    .ts{font:17px Arial,sans-serif;fill:#10233d}
    .mono{font:18px "Courier New",monospace;fill:#10233d}
    .white{fill:#fff}
    .box{fill:#eef6ff;stroke:#8bb9e8;stroke-width:2}
    .green{fill:#edf8e9;stroke:#70b66b;stroke-width:2}
    .yellow{fill:#fff5d8;stroke:#deb95b;stroke-width:2}
    .pink{fill:#fdeaea;stroke:#e78989;stroke-width:2}
    .purple{fill:#f1ebfb;stroke:#9d82cf;stroke-width:2}
    .line{stroke:#17385f;stroke-width:4;fill:none}
  </style>

  <rect width="1600" height="1000" fill="#f7fbff"/>
  <rect x="0" y="0" width="1600" height="110" fill="#0e4b78"/>
  <text x="800" y="54" text-anchor="middle" class="title">How Much Training Data Is Needed to Make LLM_GPU Practical?</text>
  <text x="800" y="88" text-anchor="middle" class="sub">Guideline for the current ≈0.75M-parameter model</text>

  <rect x="30" y="135" rx="18" ry="18" width="500" height="330" class="box"/>
  <text x="55" y="175" class="h">Current LLM_GPU Configuration</text>
  <text x="70" y="220" class="t">Vocabulary</text><text x="330" y="220" class="t">≈ 5,000</text>
  <text x="70" y="260" class="t">d_model</text><text x="330" y="260" class="t">64</text>
  <text x="70" y="300" class="t">Transformer layers</text><text x="330" y="300" class="t">2</text>
  <text x="70" y="340" class="t">Parameters</text><text x="330" y="340" class="t">≈ 0.75M</text>
  <rect x="70" y="375" width="120" height="55" rx="10" class="pink"/>
  <rect x="230" y="365" width="170" height="75" rx="10" fill="#a9c8ff" stroke="#2f68b3" stroke-width="2"/>
  <rect x="440" y="375" width="70" height="55" rx="10" class="green"/>
  <text x="130" y="407" text-anchor="middle" class="ts">Input</text>
  <text x="315" y="397" text-anchor="middle" class="ts">LLM_GPU</text>
  <text x="315" y="421" text-anchor="middle" class="ts">2-layer Transformer</text>
  <text x="475" y="407" text-anchor="middle" class="ts">Output</text>
  <path d="M190 403 H230 M400 403 H440" class="line"/>

  <rect x="555" y="135" rx="18" ry="18" width="1015" height="330" fill="#fff" stroke="#8bb9e8" stroke-width="2"/>
  <text x="580" y="175" class="h">Training Data Scale and Expected Performance</text>
  <rect x="580" y="195" width="965" height="46" fill="#164f7c"/>
  <text x="600" y="225" class="white" font-family="Arial" font-size="19" font-weight="700">Stage</text>
  <text x="900" y="225" class="white" font-family="Arial" font-size="19" font-weight="700">Training Tokens</text>
  <text x="1120" y="225" class="white" font-family="Arial" font-size="19" font-weight="700">Expected Status</text>

  <rect x="580" y="241" width="965" height="48" fill="#eef4ff"/>
  <rect x="580" y="289" width="965" height="48" fill="#e5f0ff"/>
  <rect x="580" y="337" width="965" height="48" fill="#edf8e9"/>
  <rect x="580" y="385" width="965" height="48" fill="#fff5d8"/>
  <rect x="580" y="433" width="965" height="48" fill="#fdeaea"/>
  <text x="600" y="272" class="ts">Initial test</text><text x="900" y="272" class="ts">100K–500K</text><text x="1120" y="272" class="ts">Sentence-like text</text>
  <text x="600" y="320" class="ts">Small-scale experiment</text><text x="900" y="320" class="ts">1M–3M</text><text x="1120" y="320" class="ts">Learning trends become visible</text>
  <text x="600" y="368" class="ts">Specific-domain prototype</text><text x="900" y="368" class="ts">3M–10M</text><text x="1120" y="368" class="ts">Limited-domain usefulness</text>
  <text x="600" y="416" class="ts">Current-model limit</text><text x="900" y="416" class="ts">10M–30M</text><text x="1120" y="416" class="ts">Capacity limit becomes visible</text>
  <text x="600" y="464" class="ts">General-purpose conversation</text><text x="900" y="464" class="ts">100M–billions</text><text x="1120" y="464" class="ts">Requires a much larger model</text>

  <rect x="30" y="500" rx="18" ry="18" width="750" height="450" fill="#fff" stroke="#8bb9e8" stroke-width="2"/>
  <text x="55" y="540" class="h">Training Data vs. Model Capacity</text>
  <line x1="105" y1="870" x2="735" y2="870" stroke="#17385f" stroke-width="3"/>
  <line x1="105" y1="870" x2="105" y2="590" stroke="#17385f" stroke-width="3"/>
  <path d="M115 620 C230 760 380 805 720 820" stroke="#2c65b0" stroke-width="5" fill="none"/>
  <path d="M115 600 C245 735 420 790 720 805" stroke="#e68a2e" stroke-width="4" fill="none" stroke-dasharray="12 8"/>
  <path d="M115 610 C240 748 400 798 720 813" stroke="#5d9c52" stroke-width="4" fill="none" stroke-dasharray="5 7"/>
  <line x1="300" y1="590" x2="300" y2="870" stroke="#d7e4f2" stroke-width="2"/>
  <line x1="480" y1="590" x2="480" y2="870" stroke="#d7e4f2" stroke-width="2"/>
  <line x1="620" y1="590" x2="620" y2="870" stroke="#d7e4f2" stroke-width="2"/>
  <text x="145" y="910" class="ts">100K</text><text x="285" y="910" class="ts">1M</text><text x="460" y="910" class="ts">10M</text><text x="605" y="910" class="ts">100M+</text>
  <text x="205" y="850" class="ts">Initial learning</text>
  <text x="350" y="850" class="ts">Useful learning</text>
  <text x="500" y="850" class="ts">Capacity limit</text>
  <text x="625" y="850" class="ts">Larger model needed</text>
  <text x="390" y="575" class="ts">Lower loss / perplexity is better</text>

  <rect x="805" y="500" rx="18" ry="18" width="335" height="450" class="purple"/>
  <text x="830" y="540" class="h">Rule of Thumb</text>
  <text x="835" y="585" class="t">Training tokens are often</text>
  <text x="835" y="620" class="t" font-weight="700">10–30× model parameters</text>
  <rect x="845" y="660" width="255" height="120" rx="15" fill="#fff" stroke="#b8a5da" stroke-width="2"/>
  <text x="972" y="710" text-anchor="middle" class="t">0.75M × 20</text>
  <text x="972" y="755" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#6f24a8">≈ 15M tokens</text>
  <text x="835" y="830" class="t">Recommended experimental target:</text>
  <text x="835" y="870" class="t" font-weight="700">10M–20M tokens</text>

  <rect x="1165" y="500" rx="18" ry="18" width="405" height="210" class="green"/>
  <text x="1190" y="540" class="h">Next Model Example</text>
  <text x="1195" y="580" class="ts">Vocabulary: 8K–16K</text>
  <text x="1195" y="610" class="ts">d_model: 128</text>
  <text x="1195" y="640" class="ts">Layers: 4–6   Heads: 4–8</text>
  <text x="1195" y="670" class="ts">Parameters: few M–10M</text>
  <text x="1195" y="700" class="ts">Training data: 30M–200M tokens</text>

  <rect x="1165" y="735" rx="18" ry="18" width="405" height="215" class="box"/>
  <text x="1190" y="775" class="h">Role in QHA / LLM_SEM</text>
  <text x="1190" y="815" class="ts">Input → LLM_GPU → Semantic Vector</text>
  <text x="1190" y="845" class="ts">→ LLM_SEM → VM Routing (QHA)</text>
  <text x="1190" y="885" class="ts">Semantic quality matters more than</text>
  <text x="1190" y="915" class="ts">ChatGPT-scale text generation.</text>
</svg>